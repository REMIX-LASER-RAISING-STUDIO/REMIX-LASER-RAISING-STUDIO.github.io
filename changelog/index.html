<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0c10">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <meta property="og:site_name" content="RLRS Studio">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <title>更新日志 | RLRS Studio</title>
  <meta name="description" content="燧石启动器（Chert Launcher）更新日志。">
  <meta property="og:title" content="Chert Launcher Changelog">
  <meta property="og:url" content="https://remix-laser-raising-studio.github.io/changelog/">
</head>
<body data-nav="changelog">
  <main class="page">
    <section class="section"><div class="container" style="max-width:760px">
      <div class="section-head"><span class="kicker">Changelog</span><h2 data-t="log.t"></h2><p data-t="log.s"></p></div>
      <div class="log-entry">
        <h3><span class="mono">v<span data-rel-ver>…</span></span> <span class="badge" data-t="dl.1tag"></span> <time data-rel-date></time></h3>
        <div class="notes" data-rel-changelog>Loading…</div>
      </div>
      <p style="color:var(--text-3);font-size:14px">
        <a href="https://github.com/BingJian-REMIX/Chert-WPF/releases" target="_blank" rel="noopener" style="color:var(--accent)">更早版本见 GitHub Releases →</a>
      </p>
    </div></section>
  </main>
  <script src="/js/site-i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    (function(){
      function fill(w){ if(!w) return;
        document.querySelectorAll("[data-rel-ver]").forEach(e=>e.textContent=w.version);
        document.querySelectorAll("[data-rel-date]").forEach(e=>e.textContent=w.releaseDate||"");
        document.querySelectorAll("[data-rel-changelog]").forEach(e=>e.textContent=w.changelog||""); }
      fetch("/chert-upgrade/latest.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null)
        .then(j=>fill(j&&j.wpf)).catch(()=>{});
    })();
  </script>
  <script src="/js/embers.js"></script>
  <script src="/js/seasonal.js"></script>
</body>
</html>
