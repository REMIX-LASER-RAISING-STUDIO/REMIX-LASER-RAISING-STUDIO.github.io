<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RLRS Studio — 把想法做成真正好用的工具</title>
    <meta name="description" content="RLRS Studio 是一个独立工作室，专注于开发纯粹、本地优先的极客桌面软件。" />
    <meta name="theme-color" content="#07090f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-nav="home">
    <main class="page" style="padding-top: 120px; padding-bottom: 80px;">
        
        <!-- Hero -->
        <section class="hero" style="text-align: center; margin-bottom: 60px;">
            <div class="badge">✦ RLRS Studio</div>
            <h1 class="tagline">把想法，做成真正好用的工具。</h1>
            <p class="desc" style="max-width: 600px; margin: 0 auto;">拒绝臃肿与云端绑架，只用极致的代码与算力，死磕底层的稳定与体验。</p>
        </section>

        <!-- 工作室项目 (取自 i18n HUB) -->
        <h2 class="section-title reveal" id="projects" data-t="hub.t">我们做的东西</h2>
        <p class="reveal" data-t="hub.s" style="text-align: center; color: var(--text-2); margin-bottom: 40px;"></p>
        
        <div class="grid reveal" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;">
            
            <!-- Chert -->
            <a href="https://chert-launcher.github.io" target="_blank" rel="noopener" class="product-card">
                <div class="icon">⛏️</div>
                <h3 data-t="hub.chert.t">燧石启动器</h3>
                <div class="platform" data-t="hub.chert.tag">Windows · 2.6.0</div>
                <div class="desc" data-t="hub.chert.d"></div>
            </a>

            <!-- Chert Server -->
            <div class="product-card">
                <div class="icon">🖥️</div>
                <h3 data-t="hub.server.t">Chert Server</h3>
                <div class="platform" data-t="hub.server.tag">规划中</div>
                <div class="desc" data-t="hub.server.d"></div>
            </div>

            <!-- VD Explorer -->
            <div class="product-card">
                <div class="icon">💽</div>
                <h3 data-t="hub.vd.t">VD Explorer</h3>
                <div class="platform" data-t="hub.vd.tag">开发中</div>
                <div class="desc" data-t="hub.vd.d"></div>
            </div>

            <!-- ChemiLab -->
            <div class="product-card">
                <div class="icon">🧪</div>
                <h3 data-t="hub.chem.t">ChemiLab</h3>
                <div class="platform" data-t="hub.chem.tag">开发中</div>
                <div class="desc" data-t="hub.chem.d"></div>
            </div>

            <!-- SR Tools -->
            <a href="/sr/" class="product-card">
                <div class="icon">🌠</div>
                <h3 data-t="hub.sr.t">崩铁工具</h3>
                <div class="platform" data-t="hub.sr.tag">进行中</div>
                <div class="desc" data-t="hub.sr.d"></div>
            </a>

            <!-- Join & Log -->
            <a href="/join/" class="product-card">
                <div class="icon">🤝</div>
                <h3 data-t="hub.join.t">加入社区</h3>
                <div class="platform" data-t="hub.join.tag">开放</div>
                <div class="desc" data-t="hub.join.d"></div>
            </a>
            <a href="/changelog/" class="product-card">
                <div class="icon">📜</div>
                <h3 data-t="hub.log.t">更新日志</h3>
                <div class="platform" data-t="hub.log.tag">最新</div>
                <div class="desc" data-t="hub.log.d"></div>
            </a>
        </div>
    </main>

    <script src="/js/site-i18n.js" charset="utf-8"></script>
    <script src="/js/layout.js" charset="utf-8"></script>
    <script src="/js/particles.js" charset="utf-8"></script>
    <script src="/js/seasonal.js" charset="utf-8"></script>
    <script>
        document.querySelectorAll('.reveal').forEach((el) => {
            const io = new IntersectionObserver((entries) => {
                entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
            }, { threshold: 0.12 });
            io.observe(el);
        });
    </script>
    <script src="/festival-fx.js" defer></script>
</body>
</html>
