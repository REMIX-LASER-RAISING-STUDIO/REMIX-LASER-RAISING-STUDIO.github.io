<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RLRS Studio — REMIX激越工作室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0c10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 720px;
            width: 100%;
            padding: 56px 48px 40px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeUp 1s ease-out both;
        }

        .badge-top {
            display: inline-block;
            background: rgba(255, 215, 0, 0.12);
            color: #ffd700;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            margin-bottom: 24px;
        }

        .logo {
            font-size: 72px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #f7971e, #ffd200, #f7971e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s ease-in-out infinite;
            line-height: 1;
            margin-bottom: 8px;
        }
        .logo-sub {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            letter-spacing: 4px;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .tagline {
            color: #e8edf5;
            font-size: 30px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 8px;
        }
        .tagline span {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc {
            color: rgba(255, 255, 255, 0.45);
            font-size: 16px;
            line-height: 1.7;
            max-width: 440px;
            margin: 12px auto 28px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(100, 255, 218, 0.06);
            padding: 10px 28px;
            border-radius: 60px;
            border: 1px solid rgba(100, 255, 218, 0.12);
            margin-bottom: 32px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #64ffda;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        .status-text {
            color: #64ffda;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .status-text small {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
            font-size: 13px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-bottom: 36px;
        }
        .btn {
            padding: 14px 40px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #f7971e);
            color: #0a0c10;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 48px rgba(255, 215, 0, 0.35);
        }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            color: #ccd6f6;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 215, 0, 0.2);
            transform: translateY(-3px);
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
        }
        .socials a {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.25s;
            letter-spacing: 0.5px;
        }
        .socials a:hover {
            color: #ffd700;
        }

        .footer {
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 12px;
            letter-spacing: 1px;
        }
        .footer a {
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
        }
        .footer a:hover {
            color: rgba(255, 215, 0, 0.4);
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 24px 32px;
                border-radius: 32px;
            }
            .logo {
                font-size: 52px;
            }
            .tagline {
                font-size: 22px;
            }
            .btn {
                padding: 12px 28px;
                font-size: 14px;
                width: 100%;
                justify-content: center;
            }
            .actions {
                flex-direction: column;
                align-items: stretch;
            }
            .socials {
                flex-wrap: wrap;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="card">

        <div class="badge-top">✦ 独立工作室</div>

        <div class="logo">RLRS</div>
        <div class="logo-sub">REMIX 激越工作室</div>

        <h1 class="tagline">
            激越 · <span>不止于游戏工具</span>
        </h1>

        <p class="desc">
            REMIX激越工作室 · 独立开发 · 探索技术与创意的边界
        </p>

        <div class="status">
            <span class="status-dot"></span>
            <span class="status-text">
                MCLCS 公测中
                <small>· Windows</small>
            </span>
        </div>

        <div class="actions">
            <a href="/mclcs/" class="btn btn-primary">
                ⬇ 下载 MCLCS
            </a>
            <a href="https://cnb.cool/RLRS-Studio" target="_blank" class="btn btn-ghost">
                cnb.cool
            </a>
            <a href="/join/" class="btn btn-ghost">
                🙋 加入我们
            </a>
        </div>

        <div class="socials">
            <a href="/join/">加入我们</a>
            <a href="https://space.bilibili.com/2090624670" target="_blank">B站</a>
            <a href="mailto:bingjianremix@outlook.com">邮箱</a>
            <a href="https://cnb.cool/RLRS-Studio/MCLCS-WPF" target="_blank">文档</a>
        </div>

        <div class="footer">
            © 2026 · <a href="/">RLRS Studio</a> · 由 BingJian_REMIX 创立
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            const COUNT = 80;
            const MAX_SPEED = 0.3;
            const CONNECT_DIST = 150;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.vx = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.vy = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.r = Math.random() * 2 + 1.2;
                    this.alpha = Math.random() * 0.5 + 0.2;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > w) this.vx *= -1;
                    if (this.y < 0 || this.y > h) this.vy *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 215, 0, ' + this.alpha + ')';
                    ctx.fill();
                }
            }

            for (var i = 0; i < COUNT; i++) {
                particles.push(new Particle());
            }

            function drawLines() {
                for (var i = 0; i < particles.length; i++) {
                    for (var j = i + 1; j < particles.length; j++) {
                        var dx = particles[i].x - particles[j].x;
                        var dy = particles[i].y - particles[j].y;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONNECT_DIST) {
                            var alpha = (1 - dist / CONNECT_DIST) * 0.25;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = 'rgba(255, 215, 0, ' + alpha + ')';
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
            }

            function loop() {
                ctx.clearRect(0, 0, w, h);
                for (var i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                drawLines();
                requestAnimationFrame(loop);
            }
            loop();
        })();
    </script>

</body>
</html>
