<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>崩坏星穹铁道 · 工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0c10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
            animation: fadeUp 0.8s ease-out both;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .nav-bar a {
            color: rgba(255, 255, 255, 0.25);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.25s;
        }
        .nav-bar a:hover {
            color: #ffd700;
        }
        .nav-bar .brand {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            font-size: 15px;
        }
        .nav-bar .brand span {
            color: #ffd700;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .header .logo {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffd700, #f7971e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            letter-spacing: 6px;
            font-weight: 300;
            margin-top: 2px;
        }
        .header .tag {
            color: rgba(255, 255, 255, 0.3);
            font-size: 15px;
            margin-top: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 36px 28px 32px;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .product-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 215, 0, 0.2);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .product-card .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .product-card h3 {
            color: #e8edf5;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .product-card .platform {
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            letter-spacing: 2px;
            margin-top: 2px;
        }
        .product-card .desc {
            color: rgba(255, 255, 255, 0.35);
            font-size: 14px;
            line-height: 1.6;
            margin: 12px 0 18px;
            flex: 1;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .status-badge.ready {
            background: rgba(100, 255, 218, 0.08);
            color: #64ffda;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }
        .status-badge.building {
            background: rgba(255, 215, 0, 0.06);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.08);
        }

        .product-card .btn-hint {
            margin-top: 14px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 13px;
            transition: color 0.25s;
        }
        .product-card:hover .btn-hint {
            color: rgba(255, 215, 0, 0.3);
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.05);
            font-size: 12px;
            letter-spacing: 1px;
            padding-top: 32px;
            margin-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }
        .footer a {
            color: rgba(255, 255, 255, 0.08);
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .product-card {
                padding: 28px 20px 24px;
            }
            .header .logo {
                font-size: 34px;
            }
            .nav-bar {
                justify-content: center;
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="container">

        <div class="nav-bar">
            <a href="/" class="brand">◀ <span>RLRS</span> Studio</a>
            <a href="/join/">加入我们</a>
        </div>

        <div class="header">
            <div class="logo">🌠 崩坏星穹铁道</div>
            <div class="sub">HONKAI · STAR RAIL</div>
            <div class="tag">工具集 · 独立页面</div>
        </div>

        <div class="grid">

            <a href="/sr/pages/damage-calculator.html" target="_blank" class="product-card">
                <div class="icon">⚔️</div>
                <h3>总伤计算器</h3>
                <div class="platform">独立工具</div>
                <div class="desc">快速计算角色总伤害</div>
                <span class="status-badge ready">● 立即使用</span>
                <span class="btn-hint">新标签页打开 ↗</span>
            </a>

            <a href="/sr/pages/gacha-simulator.html" target="_blank" class="product-card">
                <div class="icon">🎰</div>
                <h3>抽卡模拟器</h3>
                <div class="platform">独立工具</div>
                <div class="desc">模拟抽卡，测试血统</div>
                <span class="status-badge ready">● 立即使用</span>
                <span class="btn-hint">新标签页打开 ↗</span>
            </a>

        </div>

        <div class="footer">
            © 2026 <a href="/">RLRS Studio</a> · 由 BingJian_REMIX 创立
        </div>

    </div>

    <script>
        (function() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            const COUNT = 60;
            const MAX_SPEED = 0.2;
            const CONNECT_DIST = 130;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.vx = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.vy = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.r = Math.random() * 2 + 1;
                    this.alpha = Math.random() * 0.4 + 0.1;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > w) this.vx *= -1;
                    if (this.y < 0 || this.y > h) this.vy *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 215, 0, ' + this.alpha + ')';
                    ctx.fill();
                }
            }

            for (var i = 0; i < COUNT; i++) {
                particles.push(new Particle());
            }

            function drawLines() {
                for (var i = 0; i < particles.length; i++) {
                    for (var j = i + 1; j < particles.length; j++) {
                        var dx = particles[i].x - particles[j].x;
                        var dy = particles[i].y - particles[j].y;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONNECT_DIST) {
                            var alpha = (1 - dist / CONNECT_DIST) * 0.15;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = 'rgba(255, 215, 0, ' + alpha + ')';
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function loop() {
                ctx.clearRect(0, 0, w, h);
                for (var i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                drawLines();
                requestAnimationFrame(loop);
            }
            loop();
        })();
    </script>

</body>
</html>
