<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加入极客基地 | RLRS Studio</title>
  <meta name="theme-color" content="#07090f" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>/* 关键兜底：样式表加载/命中缓存前也保证底色正确 */
html{background:#07090f}html[data-theme="light"]{background:#f4f6fb}</style>
  <link rel="stylesheet" href="/css/style.css?v=20261026b" />
<script>/* 主题记忆：与 RLRS Hub 共用同一键，跨页不跳色 */
try{if(localStorage.getItem("rlrs-hub-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>
<body data-nav="join">
  <main class="page" style="padding-top: 120px; padding-bottom: 80px;">
    <section class="hero" style="text-align: center; margin-bottom: 40px;">
      <div class="badge" data-t="join.badge">✦ 招贤纳士</div>
      <h1 class="tagline" data-t="join.title2">加入极客基地</h1>
      <div class="brand-full" style="margin-bottom:14px" data-t="join.desc2">RLRS 激越工作室</div>
    </section>

    <section class="card reveal" style="max-width: 680px; margin: 0 auto; padding: 40px;">
      <p class="desc" data-t="join.desc3" style="text-align: center; margin-bottom: 32px;"></p>

      <ul class="roadmap" style="margin-bottom: 32px; list-style: none; padding: 0;">
        <li data-t="join.r1" style="margin-bottom: 12px; color: var(--text);">开发者</li>
        <li data-t="join.r2" style="margin-bottom: 12px; color: var(--text);">美术与 UI</li>
        <li data-t="join.r3" style="margin-bottom: 12px; color: var(--text);">策划与内容</li>
        <li data-t="join.r4" style="margin-bottom: 12px; color: var(--text);">社区运营</li>
      </ul>

      <div class="actions" style="margin-bottom: 32px; justify-content: center; display: flex; gap: 16px;">
        <a href="mailto:bingjianremix@outlook.com" class="btn btn-primary" data-t="join.btn.email"></a>
        <a href="https://space.bilibili.com/2090624670" target="_blank" rel="noopener" class="btn btn-ghost" data-t="join.btn.bili"></a>
      </div>

      <div class="qr-row" style="display: flex; gap: 32px; justify-content: center; border-top: 1px solid var(--border); padding-top: 40px;">
        <figure class="qr" style="text-align: center; margin: 0;">
          <img src="/join/assets/qrcode-qq.png" alt="QQ 群" style="width: 140px; height: 140px; border-radius: 12px; border: 1px solid var(--border); padding: 4px; background: #fff;" />
          <figcaption data-t="join.qr.qq" style="margin-top: 12px; font-size: 13px; color: var(--text-2);"></figcaption>
        </figure>
        <figure class="qr" style="text-align: center; margin: 0;">
          <img src="/join/assets/qrcode-bilibili.png" alt="B 站" style="width: 140px; height: 140px; border-radius: 12px; border: 1px solid var(--border); padding: 4px; background: #fff;" />
          <figcaption data-t="join.qr.bili" style="margin-top: 12px; font-size: 13px; color: var(--text-2);"></figcaption>
        </figure>
      </div>
    </section>
  </main>

  <script src="/js/site-i18n.js?v=20261026b" charset="utf-8"></script>
  <script src="/js/layout.js?v=20261026b" charset="utf-8"></script>
  <script src="/js/particles.js?v=20261026b" charset="utf-8"></script>
  <script src="/festival-fx.js?v=20261026b" defer></script>
</body>
</html>
