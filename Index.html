<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RLRS Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0f14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      text-align: center;
    }
    .logo {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .sub {
      color: #8892a8;
      font-size: 20px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .tagline {
      color: #ccd6f6;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: #1e2a3a;
      color: #64ffda;
      padding: 10px 28px;
      border-radius: 40px;
      font-size: 18px;
      font-weight: 500;
      border: 1px solid #233554;
      margin-bottom: 32px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }
    .links a {
      color: #ccd6f6;
      text-decoration: none;
      background: #1e2a3a;
      padding: 12px 32px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 500;
      border: 1px solid #233554;
      transition: all 0.25s;
    }
    .links a:hover {
      background: #233554;
      border-color: #64ffda;
      color: #64ffda;
      transform: translateY(-2px);
    }
    .footer {
      margin-top: 48px;
      color: #495670;
      font-size: 14px;
      border-top: 1px solid #1e2a3a;
      padding-top: 24px;
    }
    .footer a {
      color: #64ffda;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">RLRS</div>
    <div class="sub">REMIX LASER RASING STUDIO</div>
    <div class="tagline">Making Minecraft Smarter.</div>
    <div class="badge">🚀 MCLCS · 公测中</div>
    <div class="links">
      <a href="https://github.com/RLRS-Studio/MCLCS" target="_blank">GitHub</a>
      <a href="https://space.bilibili.com/2090624670" target="_blank">B站</a>
      <a href="mailto:bingjianremix@outlook.com">联系</a>
    </div>
    <div class="footer">
      © 2026 <a href="https://github.com/RLRS-Studio">RLRS Studio</a> · 由 BingJian_REMIX 创立
    </div>
  </div>
</body>
</html>
