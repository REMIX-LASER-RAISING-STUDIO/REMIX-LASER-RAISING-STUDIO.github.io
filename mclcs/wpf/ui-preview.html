<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCLCS — Minecraft 启动器</title>
<style>
:root{
  --titlebar-h:52px;
  --statusbar-h:30px;
  --tab-h:34px;
  --trans:200ms;
}
/* ============ 主题令牌（与 WPF Themes 一致） ============ */
html[data-theme="dark"]{
  --window-bg:#0F1115;
  --control-bg:#1A1D24;
  --control-border:#2A2F3A;
  --control-hover:#252830;
  --card-bg:rgba(26,29,36,.70);
  --card-border-hover:#3B82F6;
  --toggle-off:#3A3F4A;
  --primary-fg:#FFFFFF;
  --secondary-fg:#C8CDD6;
  --accent:#3B82F6;
  --accent-hover:#2B6FE0;
  --danger:#E74C3C;
  --input-bg:#14161C;
  --input-fg:#E6E6E6;
  --input-border:#2A2F3A;
  --input-focus:#3B82F6;
  --progress-bg:#2A2F3A;
  --progress-fg:#3B82F6;
  --list-bg:#14161C;
  --status-fg:#C8CDD6;
  --scrim:rgba(0,0,0,.5);
  --card-shadow:rgba(0,0,0,.28);
}
html[data-theme="light"]{
  --window-bg:#F5F5F5;
  --control-bg:#FFFFFF;
  --control-border:#D1D5DB;
  --control-hover:#F0F0F0;
  --card-bg:rgba(255,255,255,.90);
  --card-border-hover:#2563EB;
  --toggle-off:#D1D5DB;
  --primary-fg:#1A1A1A;
  --secondary-fg:#6B7280;
  --accent:#2563EB;
  --accent-hover:#1D4ED8;
  --danger:#DC2626;
  --input-bg:#FFFFFF;
  --input-fg:#1A1A1A;
  --input-border:#D1D5DB;
  --input-focus:#2563EB;
  --progress-bg:#D1D5DB;
  --progress-fg:#2563EB;
  --list-bg:#FFFFFF;
  --status-fg:#6B7280;
  --scrim:rgba(0,0,0,.35);
  --card-shadow:rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{
  font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:13px;
  color:var(--primary-fg);
  background:#000;
  overflow:hidden;
  user-select:none;
}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--control-border);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--secondary-fg)}
::-webkit-scrollbar-track{background:transparent}

/* ============ 应用窗口 ============ */
.app{display:flex;flex-direction:column;height:100vh;width:100vw;background:var(--window-bg)}

/* ============ 标题栏 ============ */
.titlebar{
  height:var(--titlebar-h);flex:0 0 var(--titlebar-h);
  display:flex;align-items:center;
  background:var(--titlebar-color,#4CAF50);
  transition:background var(--trans) ease;
  padding-right:10px;
  position:relative;z-index:40;
}
.brand{
  color:#fff;font-size:17px;font-weight:700;margin-left:16px;margin-right:12px;
  letter-spacing:.5px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.15);
}
.gsearch-wrap{width:272px;display:flex;align-items:center;margin-right:12px;flex:0 0 272px}
.gsearch{
  flex:1;height:30px;background:rgba(255,255,255,.19);color:#fff;
  border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:0 8px;font-size:12px;
  outline:none;caret-color:#fff;
}
.gsearch::placeholder{color:rgba(255,255,255,.75)}
.gsearch:focus{background:rgba(255,255,255,.28)}
.gsearch-btn{
  width:40px;height:30px;margin-left:6px;background:rgba(255,255,255,.19);border:none;
  border-radius:4px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;
}
.gsearch-btn:hover{background:rgba(255,255,255,.32)}
.badge{
  position:absolute;top:-6px;right:-8px;min-width:14px;height:14px;background:#E53935;
  border-radius:7px;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;
  padding:0 3px;
}

/* ============ 索引贴主标签 ============ */
.tabs{display:flex;align-items:center;margin-left:auto;margin-right:8px}
.tab{
  height:var(--tab-h);display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;cursor:pointer;position:relative;
  transition:width var(--trans) ease, background-color 150ms ease, margin-left var(--trans) ease;
  overflow:hidden;white-space:nowrap;flex:0 0 auto;
}
.tab .label{padding:0 14px;pointer-events:none}
.tab .underline{
  position:absolute;bottom:0;left:0;right:0;height:3px;opacity:0;
  transition:opacity var(--trans) ease;
}
.tab.selected .underline{opacity:1}
.tab:not(.selected) .label{opacity:0;width:0;padding:0}

/* ============ 窗口控制 ============ */
.winctl{display:flex;align-items:center;margin-left:6px}
.winbtn{
  width:36px;height:30px;background:transparent;border:none;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:4px;
}
.winbtn:hover{background:rgba(255,255,255,.2)}
.winbtn.close:hover{background:#E74C3C}

/* ============ 主体 ============ */
.body{flex:1;display:flex;min-height:0;position:relative}

/* ============ 侧边栏 ============ */
.sidebar{
  flex:0 0 auto;width:56px;background:var(--control-bg);
  border-right:1px solid var(--control-border);
  transition:width var(--trans) cubic-bezier(.4,0,.2,1);
  overflow-x:hidden;overflow-y:auto;padding:8px 6px;z-index:20;
}
.sidebar .sgroup{margin:10px 0 4px;padding:0 8px;font-size:10px;color:var(--secondary-fg);opacity:.7;
  white-space:nowrap;letter-spacing:.5px;display:none}
.sidebar.expanded .sgroup{display:block}
.sitem{
  height:40px;margin:2px 0;display:flex;align-items:center;cursor:pointer;
  border-radius:6px;position:relative;padding-left:11px;color:var(--secondary-fg);
  white-space:nowrap;transition:background 120ms ease;
}
.sitem:hover{background:var(--control-hover)}
.sitem.active{background:var(--control-hover);color:#fff}
.sitem .indicator{
  position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;
  background:var(--sidebar-indicator,#4CAF50);opacity:0;transition:opacity 150ms ease;
}
.sitem.active .indicator{opacity:1}
.sitem svg{flex:0 0 auto;width:18px;height:18px}
.sitem .txt{margin-left:10px;font-size:13px;opacity:0;transition:opacity 120ms ease;pointer-events:none}
.sidebar.expanded .sitem .txt{opacity:1}

/* ============ 内容宿主 ============ */
.page-host{flex:1;min-width:0;position:relative;overflow:hidden;background:var(--window-bg)}
.page-tint{position:absolute;inset:0;pointer-events:none;z-index:0;transition:opacity var(--trans) ease}
.page{
  position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;
  animation:pageIn var(--trans) ease;
}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* ============ 通用组件 ============ */
.card{
  background:var(--card-bg);border:1px solid var(--control-border);border-radius:12px;
  padding:14px;box-shadow:0 2px 10px var(--card-shadow);
  transition:transform 150ms ease,border-color 150ms ease;
}
.card:hover{transform:translateY(-6px);border-color:var(--card-border-hover)}
.hflow{display:flex;gap:14px;overflow-x:auto;padding:6px 2px}
.hflow .card{flex:0 0 auto}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
.section-title h3{font-size:14px;font-weight:700}
.hint{color:var(--secondary-fg);font-size:12px;margin:6px 2px 0}

.btn{
  background:var(--control-bg);color:var(--primary-fg);border:1px solid var(--control-border);
  border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;transition:border-color 120ms ease,opacity 120ms ease;
  white-space:nowrap;
}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:#fff;border:none;padding:8px 16px}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;border:1px solid var(--control-border)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:4px 10px}

.input{
  background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);
  border-radius:8px;padding:6px 8px;font-size:12px;outline:none;min-height:30px;
}
.input:focus{border-color:var(--input-focus)}
select.input{cursor:pointer}
select.input option{background:var(--control-bg);color:var(--primary-fg)}

/* 滑动开关 */
.switch{
  width:44px;height:24px;flex:0 0 44px;border-radius:12px;background:var(--toggle-off);
  cursor:pointer;position:relative;transition:background 150ms ease;border:none;
}
.switch::after{
  content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform 150ms ease;
}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
.switch:disabled{opacity:.5}
.row{display:flex;align-items:center}
.switch-row{display:flex;align-items:center;margin:8px 0}
.switch-row .txt{margin-left:8px}

/* 弹窗 */
.scrim{
  position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  z-index:100;animation:scrimIn 150ms ease;
}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--control-bg);border:1px solid var(--control-border);border-radius:14px;
  padding:22px;max-width:560px;width:calc(100% - 60px);max-height:88%;overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.modal h4{font-size:16px;font-weight:700;margin-bottom:12px}
.modal .btnrow{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ============ 状态栏 ============ */
.statusbar{
  height:var(--statusbar-h);flex:0 0 var(--statusbar-h);background:var(--control-bg);
  border-top:1px solid var(--control-border);display:flex;align-items:center;padding:0 12px;
  font-size:12px;color:var(--status-fg);gap:14px;overflow:hidden;white-space:nowrap;
}
.statusbar .spacer{flex:1}
.sbar-progress{width:120px;height:10px;background:var(--progress-bg);border-radius:5px;overflow:hidden}
.sbar-progress>div{height:100%;background:var(--progress-fg);width:0;transition:width .3s ease}
.dot{width:8px;height:8px;border-radius:50%}
.dot.green{background:#4CAF50}.dot.yellow{background:#FFC107}.dot.red{background:#E74C3C}
.music-mini{display:flex;align-items:center;gap:6px}
.music-mini button{width:24px;height:22px;background:transparent;border:none;color:var(--status-fg);cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center}
.music-mini button:hover{background:var(--control-hover)}

/* Toast */
.toasts{position:absolute;right:16px;bottom:40px;width:330px;z-index:200;display:flex;flex-direction:column;gap:6px}
.toast{
  background:var(--control-bg);border:1px solid var(--control-border);border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;overflow:hidden;
  animation:toastIn 200ms ease;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast .bar{width:4px;flex:0 0 4px;background:var(--accent)}
.toast .body{padding:10px 8px 10px 12px;flex:1}
.toast .body b{font-size:13px}
.toast .body p{font-size:12px;color:var(--secondary-fg);margin-top:3px}
.toast .body .tbtn{margin-top:7px;padding:3px 10px;font-size:12px}
.toast .x{width:26px;flex:0 0 26px;background:transparent;border:none;color:var(--secondary-fg);cursor:pointer;font-size:12px}

/* ============ 页面级样式 ============ */
.page-pad{padding:20px}
.dl-header{padding:12px 12px 8px;border-bottom:1px solid var(--control-border)}
.dl-cards{overflow-y:auto;height:calc(100% - 78px);padding:8px 12px}
.dl-grid{display:flex;flex-wrap:wrap;gap:0}
.dl-card{
  width:196px;margin:6px;background:var(--card-bg);border:1px solid var(--control-border);
  border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
  transition:transform 150ms ease,border-color 150ms ease;
}
.dl-card:hover{transform:translateY(-4px);border-color:var(--card-border-hover)}
.dl-cover{height:110px;background:var(--control-bg);display:flex;align-items:center;justify-content:center;color:var(--secondary-fg);position:relative}
.dl-card .t{font-weight:700;margin:8px 10px 2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-card .a{font-size:11px;opacity:.7;margin:0 10px 2px}
.dl-card .v{font-size:11px;color:var(--accent);margin:0 10px 2px}
.dl-card .s{font-size:11px;opacity:.7;margin:0 10px 2px;height:32px;overflow:hidden}
.dl-card .ops{display:flex;gap:6px;margin:6px 10px 8px}
.dl-card .ops .btn{padding:3px 8px;font-size:12px}
.dl-badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px}
.expander{margin:4px 8px}
.expander-head{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;padding:6px 8px;background:var(--control-bg);border:1px solid var(--control-border);border-radius:8px}
.toolbox-scroll{height:100%;overflow-y:auto;padding:16px}
.meta-tag{font-size:11px;color:var(--secondary-fg)}

/* 日志 / 代码区 */
.console{font-family:Consolas,Monaco,monospace;font-size:12px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;padding:8px;overflow-y:auto}
.console .line{white-space:pre-wrap;padding:1px 0}
.console .err{color:#E74C3C}.console .warn{color:#FFC107}.console .info{color:#8AB4F8}.console .ok{color:#4CAF50}

/* 图标按钮 */
.ibtn{width:26px;height:26px;background:transparent;border:none;color:var(--secondary-fg);cursor:pointer;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.ibtn:hover{background:var(--control-hover);color:var(--primary-fg)}

/* 卡片流迷你卡 */
.mini-card{width:230px;height:116px;display:flex;flex-direction:column;justify-content:space-between}
.mini-card .end{align-self:flex-end}
.lat-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tag-red{background:#E74C3C;color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:8px}

/* 皮肤编辑器网格示意 */
.skin-grid{display:grid;grid-template-columns:repeat(6,36px);grid-template-rows:repeat(6,36px);gap:1px;background:var(--control-border);border:1px solid var(--control-border);width:fit-content}
.skin-grid div{background:var(--control-bg)}
.skin-grid div.filled{background:var(--accent)}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- 标题栏 -->
  <div class="titlebar" id="titlebar">
    <div class="brand">MCLCS</div>
    <div class="gsearch-wrap">
      <input class="gsearch" id="gsearch" placeholder="搜索 Mod、光影、材质包..." />
      <button class="gsearch-btn" id="dlQueueBtn" title="下载队列 / 进度">
        <span id="qBadge" class="badge" style="display:none">2</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
      </button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="winctl">
      <button class="winbtn" title="最小化"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="winbtn close" title="关闭"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>

  <!-- 主体 -->
  <div class="body">
    <div class="sidebar" id="sidebar"></div>
    <div class="page-host" id="pageHost">
      <div class="page-tint" id="pageTint"></div>
      <div class="page" id="page"></div>
      <!-- 全局弹层 -->
      <div id="modalRoot"></div>
      <div class="toasts" id="toasts"></div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="statusbar" id="statusbar"></div>
</div>

<script>
/* ============ 图标库（stroke 风格，与 PNG 图标语义对齐） ============ */
const I = {};
const ic = (name, inner, vb=24) => I[name] = `<svg viewBox="0 0 ${vb} ${vb}" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
ic('download','<path d="M12 3v11"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/>');
ic('mod','<rect x="4" y="9" width="16" height="10" rx="1.5"/><path d="M8 9V6h2v3M14 9V6h2v3"/>');
ic('shader','<path d="M12 4l2.5 5.5L20 12l-5.5 2.5L12 20l-2.5-5.5L4 12l5.5-2.5z"/>');
ic('tex','<path d="M12 3l8 4.5-8 4.5-8-4.5z"/><path d="M4 12l8 4.5 8-4.5"/><path d="M4 16.5l8 4.5 8-4.5"/>');
ic('pack','<path d="M4 9h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M3 9l9-6 9 6"/><path d="M12 9v11"/>');
ic('map','<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>');
ic('minecraft','<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/><path d="M12 3v3M9 4.5l2 2M15 4.5l-2 2"/>');
ic('log','<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>');
ic('bug','<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>');
ic('perf','<path d="M3 12h4l2-6 4 12 2-6h6"/>');
ic('net','<path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2"/>');
ic('fcd','<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>');
ic('dp','<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 3 3v6.5"/>');
ic('save','<path d="M3 18L9 8l4 6 3-3 5 7z"/><path d="M3 18h18"/>');
ic('backup','<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>');
ic('shot','<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-9 9"/>');
ic('clean','<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>');
ic('music','<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>');
ic('dev','<path d="M8 6L2 12l6 6M16 6l6 6-6 6"/>');
ic('skin','<circle cx="12" cy="5" r="2"/><rect x="8" y="9" width="8" height="12" rx="2"/>');
ic('shortcut','<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/>');
ic('flowchart','<rect x="3" y="4" width="8" height="6" rx="1.5"/><rect x="13" y="14" width="8" height="6" rx="1.5"/><path d="M7 10v4h6"/><path d="M11 7h9"/><path d="M20 7v4"/>');
ic('ai','<path d="M12 3l1.8 4.8L18.5 9l-4.7 1.2L12 15l-1.8-4.8L5.5 9l4.7-1.2z"/><path d="M18 14l.9 2.4L21.5 17l-2.6.6L18 20l-.9-2.4L14.5 17l2.6-.6z"/>');
ic('general','<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/>');
ic('launch','<circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/>');

function brighten(hex,f){
  let s=hex.replace('#',''); if(s.length===8)s=s.slice(2);
  const r=Math.min(255,Math.round(parseInt(s.slice(0,2),16)*f));
  const g=Math.min(255,Math.round(parseInt(s.slice(2,4),16)*f));
  const b=Math.min(255,Math.round(parseInt(s.slice(4,6),16)*f));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function resetTabColors(){TABORDER.forEach(k=>tabColors[k]=TABDEF[k].color)}

/* ============ 渲染标题栏标签 ============ */
function renderTabs(){
  const el=document.getElementById('tabs'); el.innerHTML='';
  TABORDER.forEach((k,i)=>{
    const def=TABDEF[k];
    const sel = k===currentTab;
    const expanded = sel || def.always;
    const w = expanded?130:56;
    const neighborExpanded = i>0 && (TABORDER[i-1]===currentTab || TABDEF[TABORDER[i-1]].always);
    const overlap = neighborExpanded?10:20;
    const ml = i===0?0:-overlap;
    const cr = i===0?'8px 0 0 8px':(i===3?'0 8px 8px 0':'0');
    const solid=tabColors[k];
    const bg = sel?brighten(solid,1.12):solid;
    const ul = brighten(solid,1.45);
    const t=document.createElement('div');
    t.className='tab'+(sel?' selected':'');
    t.dataset.kind=k;
    t.style.width=w+'px';
    t.style.marginLeft=ml+'px';
    t.style.background=bg;
    t.style.zIndex=4-i;
    t.style.borderRadius=cr;
    t.innerHTML=`<span class="label">${def.label}</span><span class="underline" style="background:${ul}"></span>`;
    t.addEventListener('mouseenter',()=>{ if(!sel) t.style.background=brighten(solid,1.2); });
    t.addEventListener('mouseleave',()=>{ t.style.background=sel?brighten(solid,1.12):solid; });
    t.addEventListener('click',()=>switchTab(k));
    el.appendChild(t);
  });
}

/* ============ 渲染侧边栏 ============ */
let sidebarExpanded=false;
function renderSidebar(){
  const el=document.getElementById('sidebar');
  const items=SIDEBAR[currentTab];
  el.innerHTML='';
  if(!items.length){ el.style.width='0px'; el.style.borderRight='none'; return; }
  el.style.width=(sidebarExpanded?152:56)+'px';
  el.style.borderRight='1px solid var(--control-border)';
  let lastGroup=null;
  items.forEach(it=>{
    if(it.group && it.group!==lastGroup){
      const g=document.createElement('div'); g.className='sgroup'; g.textContent=it.group; el.appendChild(g);
      lastGroup=it.group;
    }
    const row=document.createElement('div');
    row.className='sitem'+(it.id===selectedSide?' active':'');
    row.dataset.id=it.id;
    row.innerHTML=`<span class="indicator"></span>${icon(it.icon,18)}<span class="txt">${it.label}</span>`;
    row.addEventListener('click',()=>selectSide(it.id));
    el.appendChild(row);
  });
}
function selectSide(id){
  selectedSide=id;
  document.querySelectorAll('.sitem').forEach(n=>n.classList.toggle('active',n.dataset.id===id));
  routeContent();
}

/* 侧边栏悬停展开/收起（150ms 展开 / 300ms 收起） */
let expandTimer=null,collapseTimer=null;
const sidebarEl=()=>document.getElementById('sidebar');
function sidebarHoverEnter(){
  clearTimeout(collapseTimer);clearTimeout(expandTimer);
  if(sidebarExpanded) return;
  expandTimer=setTimeout(()=>{sidebarExpanded=true;renderSidebar();},150);
}
function sidebarHoverLeave(){
  clearTimeout(expandTimer);clearTimeout(collapseTimer);
  if(!sidebarExpanded) return;
  collapseTimer=setTimeout(()=>{sidebarExpanded=false;renderSidebar();},300);
}

/* ============ 主标签切换 ============ */
function switchTab(kind){
  if(kind===currentTab) return;
  currentTab=kind;
  const solid=tabColors[kind];
  document.getElementById('titlebar').style.setProperty('--titlebar-color',solid);
  document.getElementById('pageTint').style.background=`linear-gradient(180deg, ${solid} 0%, ${solid} 10%, var(--window-bg) 55%, var(--window-bg) 100%)`;
  renderTabs();
  // 重置副标签选中
  const items=SIDEBAR[kind];
  selectedSide = items.length?items[0].id:null;
  renderSidebar();
  routeContent();
}
function routeContent(){
  renderPage();
}

/* ============ 页面渲染 ============ */
const page=()=>document.getElementById('page');
function renderPage(){
  const host=page();
  // 用替换整个 .page 元素的方式重播页面过渡动画
  const parent=host.parentNode, next=host.nextSibling;
  const fresh=document.createElement('div');
  fresh.className='page'; fresh.id='page';
  let html='';
  if(currentTab==='game') html=gamePage();
  else if(currentTab==='download') html=downloadPage();
  else if(currentTab==='toolbox') html=toolboxPage();
  else if(currentTab==='settings') html=settingsPage();
  fresh.innerHTML=html;
  parent.replaceChild(fresh,host);
}

function toast(title,msg,accent){
  const el=document.getElementById('toasts');

  t.innerHTML=`<span class="bar" style="background:${accent==='danger'?'#E74C3C':'var(--accent)'}"></span><div class="body"><b>${title}</b><p>${msg}</p></div><button class="x" onclick="this.parentElement.remove()">✕</button>`;

}

/* ============ 全局搜索 ============ */
function initSearch(){
  document.getElementById('gsearch').addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const v=e.target.value.trim(); if(!v)return;
    const lower=v.toLowerCase();
    const kwMap=[['appearance',['主题','外观','背景','字体','颜色']],['account',['账号','账户','登录','微软','microsoft']],['launch',['启动','内存','java','路径']],['download',['下载','源','镜像','并发']],['recommend',['推荐']],['ai',['ai','助手','ollama']],['general',['语言','自启','托盘','通用']],['about',['关于','更新','版本']]];
    let target=null;
    for(const [id,keys] of kwMap){if(keys.some(k=>lower.includes(k))){target=id;break;}}
    if(target){ switchTab('settings'); selectedSide=target; renderSidebar(); renderPage(); }
    else { switchTab('download'); selectedSide='mod'; renderSidebar(); renderPage(); }
  });
}

  renderTabs();
  renderSidebar();
  renderPage();
  renderStatus();
  document.getElementById('sidebar').addEventListener('mouseenter',sidebarHoverEnter);
  document.getElementById('sidebar').addEventListener('mouseleave',sidebarHoverLeave);
  document.getElementById('dlQueueBtn').addEventListener('click',toggleQueuePopup);
  initSearch();
