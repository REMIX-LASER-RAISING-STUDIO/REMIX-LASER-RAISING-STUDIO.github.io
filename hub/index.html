<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RLRS Hub 极客专栏 | RLRS Studio</title>
  <meta name="theme-color" content="#07090f" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-nav="hub">
  <!-- 背景层（与主站共用） -->
  <div class="bg-aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas id="embers-canvas" data-color="79,140,255" data-count="42"></canvas>

  <!-- 顶栏：rlrshub 标识 + 搜索 + 主题/语言 -->
  <header class="hub-topbar">
    <div class="hub-top-left">
      <button class="hub-icon-btn" id="sidebarToggle" data-t-title="hub.t.sidebar" aria-label="侧边栏">☰</button>
      <a class="hub-brand" href="/" title="RLRS Studio">rlrshub</a>
    </div>
    <div class="hub-search">
      <span class="hub-search-ico">🔍</span>
      <input type="search" id="hubSearch" data-t-ph="hub.search" placeholder="搜索文档、技能与代码…" />
    </div>
    <div class="hub-top-right">
      <button class="hub-icon-btn" id="themeToggle" data-t-title="hub.t.theme" aria-label="主题">🌙</button>
      <select class="lang-select" aria-label="语言切换">
        <option value="zh">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="lzh">文言文</option>
      </select>
    </div>
  </header>

  <div class="hub-layout" id="hubLayout">
    <!-- 侧边栏（贴左，可收缩为图标栏） -->
    <aside class="hub-side" id="hubSide">
      <nav>
        <a class="hub-cat active" data-cat="all"><span class="ico">🗂️</span><span class="lbl" data-t="hub.nav.all">全部</span></a>
        <a class="hub-cat" data-cat="docs"><span class="ico">📄</span><span class="lbl" data-t="hub.nav.docs">文档</span></a>
        <a class="hub-cat" data-cat="skills"><span class="ico">🧩</span><span class="lbl" data-t="hub.nav.skills">开源 Skills</span></a>
        <a class="hub-cat" data-cat="csharp"><span class="ico">💻</span><span class="lbl" data-t="hub.nav.csharp">开源 C# 库</span></a>
      </nav>
    </aside>

    <!-- 内容区：只展示真正有内容的条目 -->
    <main class="hub-main" id="hubMain">
      <a class="hub-card" data-cat="skills" data-title="崩铁工具集 sr hsr 星铁 总伤计算器 抽卡模拟器" href="/sr/">
        <div class="ico">⚔️</div>
        <h3 data-t="hub.card.sr.t">崩铁工具集</h3>
        <p data-t="hub.card.sr.d">总伤计算器与全角色全光锥抽卡模拟器，免费开源。</p>
        <span class="tag" data-t="hub.nav.skills">开源 Skills</span>
      </a>

      <!-- 空态：当前分类没有内容时显示（不是卡片，指向加入我们） -->
      <div class="hub-empty" id="hubEmpty" hidden>
        <span class="hub-empty-ico">📭</span>
        <p><b data-t="hub.empty.t">这里还在搬运</b><span data-t="hub.empty.d">该分类暂时没有内容，欢迎加入我们一起把它建起来。</span></p>
        <a class="hub-empty-link" href="/join/" data-t="nav.join">加入我们 →</a>
      </div>
    </main>
  </div>

  <!-- 背景与脚本（与主站共用） -->
  <script src="/js/site-i18n.js" charset="utf-8"></script>
  <script src="/js/particles.js" charset="utf-8"></script>
  <script src="/festival-fx.js" defer></script>
  <script>
    (function(){
      // 顶栏标题（data-t-title）随语言刷新
      function refreshTitles(){
        if(!window.SI18N) return;
        document.querySelectorAll('[data-t-title]').forEach(el=>{
          const v=SI18N.t(el.dataset.tTitle);
          if(v) el.title=v, el.setAttribute('aria-label',v);
        });
        const ph=document.getElementById('hubSearch');
        if(ph) ph.placeholder=SI18N.t('hub.search');
      }
      document.addEventListener('DOMContentLoaded',refreshTitles);
      document.addEventListener('change',e=>{ if(e.target.closest('.lang-select')) setTimeout(refreshTitles,0); });

      // 主题：亮 / 暗（记忆）
      const KEY_THEME='rlrs-hub-theme';
      const tBtn=document.getElementById('themeToggle');
      function applyTheme(t){
        document.documentElement.setAttribute('data-theme',t);
        if(tBtn) tBtn.textContent = t==='light' ? '☀️' : '🌙';
      }
      applyTheme(localStorage.getItem(KEY_THEME)||'dark');
      if(tBtn) tBtn.addEventListener('click',()=>{
        const next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
        localStorage.setItem(KEY_THEME,next); applyTheme(next);
      });

      // 侧边栏收缩（记忆）
      const KEY_SIDE='rlrs-hub-side';
      const side=document.getElementById('hubSide');
      const layout=document.getElementById('hubLayout');
      const sBtn=document.getElementById('sidebarToggle');
      function applySide(collapsed){
        side.classList.toggle('collapsed',collapsed);
        if(layout) layout.classList.toggle('collapsed',collapsed);
        if(sBtn) sBtn.textContent = collapsed ? '»' : '☰';
      }
      applySide(localStorage.getItem(KEY_SIDE)==='1');
      if(sBtn) sBtn.addEventListener('click',()=>{
        const c=!side.classList.contains('collapsed');
        localStorage.setItem(KEY_SIDE,c?'1':'0'); applySide(c);
      });

      // 分类筛选 + 搜索过滤（无命中时显示空态）
      const search=document.getElementById('hubSearch');
      const empty=document.getElementById('hubEmpty');
      const cards=Array.from(document.querySelectorAll('.hub-card'));
      let curCat='all';
      function filter(){
        const q=(search.value||'').trim().toLowerCase();
        let shown=0;
        cards.forEach(c=>{
          const okCat = curCat==='all' || c.dataset.cat===curCat;
          const txt=((c.dataset.title||'')+' '+c.textContent).toLowerCase();
          const okQ = !q || txt.includes(q);
          const vis = okCat && okQ;
          c.style.display = vis ? '' : 'none';
          if(vis) shown++;
        });
        if(empty) empty.hidden = shown>0;
      }
      search.addEventListener('input',filter);
      document.querySelectorAll('.hub-cat').forEach(a=>{
        a.addEventListener('click',()=>{
          document.querySelectorAll('.hub-cat').forEach(x=>x.classList.remove('active'));
          a.classList.add('active'); curCat=a.dataset.cat; filter();
        });
      });
      filter();
    })();
  </script>
</body>
</html>
