<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赞赏支持 — RLRS Studio</title>
  <style>
    :root {
      --bg: #07090f; --text: #e9edf5; --muted: #8a93a6; --border: rgba(255,255,255,0.08);
      --accent: #4f8cff; --accent2: #a855f7;
      --font: "Inter", system-ui, sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; }
    .box h1 { font-size: 24px; margin-bottom: 12px; }
    .box p { color: var(--muted); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
    .qr { width: 200px; height: 200px; background: #fff; border-radius: 12px; padding: 10px; margin: 0 auto; }
    .qr img { width: 100%; height: 100%; object-fit: contain; }
    .back { display: inline-block; margin-top: 24px; color: var(--accent); text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>☕ 赞赏支持</h1>
    <p>RLRS Studio 的所有软件均免费、开源、无广告。<br>如果它们帮到了您，可以扫码请开发者喝杯咖啡。</p>
    <div class="qr">
      <img src="/sponsor/assets/cnb-qr.png" alt="CNB 赞赏码" />
    </div>
    <a href="/" class="back">← 返回首页</a>
  </div>
</body>
</html>
